                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-wt-green text-[#121212] flex items-center justify-center text-xl flex-shrink-0">✍</div>
                        <div><h2 class="text-sm font-extrabold text-white">เป็นนักเขียนบน KToon</h2><p class="text-[11px] text-wt-muted">ลงผลงานของคุณและให้ผู้อ่านเจอได้ฟรี</p></div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="openAuthModal('login')" class="py-2.5 rounded-lg bg-wt-card border border-wt-border text-white font-extrabold text-xs">เข้าสู่ระบบ</button>
                        <button onclick="openAuthModal('signup')" class="py-2.5 rounded-lg bg-wt-green text-[#121212] font-extrabold text-xs">สมัครสมาชิก</button>
                    </div>`);
            }
            if (!isWriter()) {
                return wrap(`
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-wt-green text-[#121212] flex items-center justify-center text-xl flex-shrink-0">✍</div>
                        <div><h2 class="text-sm font-extrabold text-white">เริ่มเป็นนักเขียน</h2><p class="text-[11px] text-wt-muted">ตั้งนามปากกา แล้วเปิดสตูดิโอได้ทันที${demo ? ' (โหมดเดโม)' : ''}</p></div>
                    </div>
                    <button onclick="openWriterOnboardingModal()" class="w-full py-2.5 rounded-lg bg-wt-green text-[#121212] font-extrabold text-xs">เริ่มเลย</button>`);
            }
            const mine = all.filter(isOwnSeries);
            const epTotal = mine.reduce((a, w) => a + (w.episodes || []).length, 0);
            const viewTotal = mine.reduce((a, w) => a + Number(((state.seriesStats || {})[w.id] || {}).views || 0), 0);
            const pen = getWriterPenName();
            const stat = (label, val) => `<div class="p-2 rounded-lg bg-black/30 text-center"><span class="block text-[10px] text-wt-muted">${label}</span><strong class="text-sm font-extrabold text-white">${val}</strong></div>`;
            return wrap(`
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-full bg-gradient-to-br from-wt-green to-emerald-700 text-[#121212] flex items-center justify-center text-lg font-black flex-shrink-0">${escapeHtml(pen.charAt(0).toUpperCase())}</div>
                    <div class="min-w-0 flex-1">
                        <h2 class="text-sm font-extrabold text-white truncate">สตูดิโอของ ${escapeHtml(pen)}</h2>
                        <p class="text-[11px] text-wt-muted">${demo ? 'โหมดเดโม • ข้อมูลอยู่ในเครื่องนี้' : escapeHtml((authState.user && authState.user.email) || '')}</p>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">${stat('ผลงาน', mine.length)}${stat('ตอน', epTotal)}${stat('ยอดอ่าน', viewTotal.toLocaleString())}</div>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="openCreatorStudioModal('c1')" class="py-2.5 rounded-lg bg-wt-green text-[#121212] font-extrabold text-[11px]">+ เรื่องใหม่</button>
                    <button onclick="${mine.length ? `openCreatorStudioModal('c2', '${mine[0].id}')` : `showToast('สร้างเรื่องก่อนนะครับ'); openCreatorStudioModal('c1')`}" class="py-2.5 rounded-lg bg-wt-card border border-wt-green/50 text-wt-green font-extrabold text-[11px]">🎬 เพิ่มตอน</button>
                    <button onclick="openCreatorStudioModal('c3')" class="py-2.5 rounded-lg bg-wt-card border border-wt-border text-white font-extrabold text-[11px]">📊 สถิติ</button>
                </div>
                ${mine.length ? `
                    <div>
                        <p class="text-[11px] font-extrabold text-white mb-1.5">ผลงานของฉัน</p>
                        <div class="space-y-1.5">
                            ${mine.slice(0, 5).map(w => `
                                <div class="p-2 rounded-xl bg-black/30 flex items-center gap-2.5">
                                    <div onclick="openSeriesDetail('${w.id}')" class="w-10 h-[52px] rounded-md overflow-hidden flex-shrink-0 cursor-pointer">${renderCoverBox(w)}</div>
                                    <div class="min-w-0 flex-1" onclick="openSeriesDetail('${w.id}')">
                                        <p class="text-xs font-bold text-white truncate">${escapeHtml(w.title)}</p>
                                        <p class="text-[10px] text-wt-muted">${(w.episodes || []).length} ตอน${w.isDraftSeries ? ' • ฉบับร่าง' : ''}${w.rating === '18+' ? ' • 18+' : ''}</p>
                                    </div>
                                    <button onclick="openCreatorStudioModal('c2', '${w.id}')" class="px-2.5 py-1.5 rounded-lg bg-wt-green/15 border border-wt-green/40 text-wt-green text-[10px] font-extrabold flex-shrink-0">+ ตอน</button>
                                </div>`).join('')}
                        </div>
                    </div>` : `
                    <div class="p-3 rounded-xl bg-black/30 text-[11px] text-gray-300 space-y-1">
                        <p class="font-extrabold text-white">เริ่มต้นง่ายๆ 3 ขั้น</p>
                        <p>1. กด "+ เรื่องใหม่" ตั้งชื่อ ใส่ปก และเรื่องย่อ</p>
                        <p>2. กด "🎬 เพิ่มตอน" ใส่ภาพหรือพิมพ์เนื้อหา</p>
                        <p>3. เลือก "เผยแพร่" ผู้อ่านจะเห็นทันที</p>
                    </div>`}
                ${demo ? '' : `<button onclick="authSignOut()" class="text-[10px] text-wt-muted underline">ออกจากระบบ</button>`}
            `);
        }

        function renderAccountLoginSection() {
            const demo = !backendReady();
            let inner;
            if (demo) {
                inner = `<p class="font-extrabold text-white">บัญชีผู้ใช้</p>
                    <p class="text-[11px] text-wt-muted leading-relaxed">โหมดเดโม ข้อมูลอยู่ในเครื่องนี้เท่านั้น ระบบสมัครสมาชิกจะเปิดเมื่อเชื่อมต่อเซิร์ฟเวอร์</p>
                    <button onclick="openBackendSettingsModal()" class="text-[11px] underline text-wt-green font-bold">ตั้งค่าเซิร์ฟเวอร์ (สำหรับผู้ดูแล)</button>`;
            } else if (isLoggedIn()) {
                inner = `<p class="font-extrabold text-white">บัญชีผู้ใช้</p>
                    <p class="text-[11px] text-gray-200 break-all">${escapeHtml(authState.user.email || '')}</p>
                    ${isWriter() ? `<p class="text-[11px] text-wt-muted">นักเขียน: ${escapeHtml(getWriterPenName())}</p>` : ''}
                    <div class="flex items-center gap-3"><button onclick="authSignOut()" class="px-3 py-1.5 rounded-lg bg-wt-card border border-wt-border text-white font-bold text-[11px]">ออกจากระบบ</button><button onclick="openBackendSettingsModal()" class="text-[10px] underline text-wt-muted">ตั้งค่าเซิร์ฟเวอร์</button></div>`;
            } else {
                inner = `<p class="font-extrabold text-white">บัญชีผู้ใช้</p>
                    <p class="text-[11px] text-wt-muted">เข้าสู่ระบบเพื่อเป็นนักเขียนและเก็บข้อมูลของคุณ</p>
                    <div class="grid grid-cols-2 gap-2"><button onclick="openAuthModal('login')" class="py-2 rounded-lg bg-wt-card border border-wt-border text-white font-bold text-[11px]">เข้าสู่ระบบ</button><button onclick="openAuthModal('signup')" class="py-2 rounded-lg bg-wt-green text-[#121212] font-extrabold text-[11px]">สมัครสมาชิก</button></div>
                    <button onclick="openBackendSettingsModal()" class="text-[10px] underline text-wt-muted">ตั้งค่าเซิร์ฟเวอร์</button>`;
            }
            return `<div class="p-3.5 rounded-xl bg-[#121212] border border-wt-border space-y-2">${inner}</div>`;
        }

        // --- 16. MAIN RENDER ENGINE ---
        function __renderAppInner() {
            const container = document.getElementById('tab-content');
            if (!container) return;

            if (state.activeTab === 'home') {
                container.innerHTML = renderHomeTab();
            } else if (state.activeTab === 'daily') {
                container.innerHTML = renderDailyTab();
            } else if (state.activeTab === 'search') {
                container.innerHTML = renderSearchTab();
            } else if (state.activeTab === 'canvas') {
                container.innerHTML = renderCanvasTab();
            } else if (state.activeTab === 'my') {
                container.innerHTML = renderMyWebtoonsTab();
            }

            document.querySelectorAll('.nav-btn').forEach(btn => {
                const isActive = btn.dataset.tab === state.activeTab;
                btn.classList.toggle('text-white', isActive);
                btn.classList.toggle('text-[#7A7A7A]', !isActive);
            });

            const pill = document.getElementById('floating-promo-pill');
            if (pill) {
                if (state.activeTab === 'home') pill.classList.remove('hidden');
                else pill.classList.add('hidden');
            }
        }

        function renderApp() {
            const full = seriesList;
            window.__allSeries = full;
            seriesList = state.showAdult ? full : full.filter(x => x.rating !== '18+');
            try {
                __renderAppInner();
            } finally {
                seriesList = full;
            }
        }

        // --- 17. BOOTSTRAP INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            ensureStateExtras();
            evaluateBadges();
            processScheduledEpisodes();
            renderApp();
            startCampaignTimer();
            setInterval(processScheduledEpisodes, 30000);
            authInit();
            const m = /#series=([^&]+)/.exec(location.hash || '');
            if (m) {
                const sid = decodeURIComponent(m[1]);
                if (seriesList.some(x => x.id === sid)) openSeriesDetail(sid);
            }
        });
    </script>
</body>
</html>
