        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message) {
            try {
                const el = document.getElementById('toast');
                if (!el) return;
                el.textContent = String(message || '');
                el.classList.remove('hidden');
                clearTimeout(window._ktoonToastTimer);
                window._ktoonToastTimer = setTimeout(() => {
                    el.classList.add('hidden');
                }, 2400);
            } catch (_) {}
        }

        function isEpisodeLive(ep) {
            const st = ep.status || 'published';
            if (st === 'published') return true;
            if (st === 'scheduled' && ep.scheduledAt) {
                const t = new Date(ep.scheduledAt).getTime();
                return Number.isFinite(t) && t <= Date.now();
            }
            return false;
        }

        function getPublishedEpisodes(series) {
            if (!series || !Array.isArray(series.episodes)) return [];
            return series.episodes.filter(isEpisodeLive);
        }

        function getNowThaiTimestamp() {

        function safeStorageWrite(key, payloadStr) {
            try {
                localStorage.setItem(key, payloadStr);
                return { ok: true, fallback: false };
            } catch (_) {
                try {
                    const parsed = JSON.parse(payloadStr);
                    if (parsed && parsed.data) {
                        parsed.data.recentHistory = (parsed.data.recentHistory || []).slice(0, 15);
                        parsed.data.comments = (parsed.data.comments || []).slice(0, 30);
                        parsed.data.coinTransactions = (parsed.data.coinTransactions || []).slice(0, 30);
                        localStorage.setItem(key, JSON.stringify(parsed));
                        return { ok: true, fallback: false };
                    }
                } catch (innerErr) {
                    console.warn('Storage trim fallback failed:', innerErr);
                }
                MEMORY_FALLBACK_STORE[key] = payloadStr;
                if (state.syncMeta) state.syncMeta.status = 'error';
                return { ok: false, fallback: true };
            }
        }

        function safeStorageRead(key) {
            try {
                const val = localStorage.getItem(key);
                if (val !== null) return val;
            } catch (_) {}
            return MEMORY_FALLBACK_STORE[key] || null;
        }

        function migrateSavedData(rawObj) {
            if (!rawObj || typeof rawObj !== 'object') return {};
            const version = Number(rawObj.schemaVersion || 1);
            const payload = rawObj.data && typeof rawObj.data === 'object' ? rawObj.data : rawObj;

            const migrated = { ...payload };
            if (version < 2) {
                migrated.bookmarks = Array.isArray(migrated.bookmarks) ? migrated.bookmarks : [];
                migrated.episodeProgress = migrated.episodeProgress && typeof migrated.episodeProgress === 'object' ? migrated.episodeProgress : {};
            }
            if (version < 3) {
                migrated.dailyPasses = Number.isFinite(Number(migrated.dailyPasses)) ? Number(migrated.dailyPasses) : 2;
                migrated.streakDays = Number.isFinite(Number(migrated.streakDays)) ? Number(migrated.streakDays) : 1;
                migrated.coinTransactions = Array.isArray(migrated.coinTransactions) ? migrated.coinTransactions : [];
                migrated.unlockedBadges = Array.isArray(migrated.unlockedBadges) ? migrated.unlockedBadges : [];
                migrated.seriesReviews = Array.isArray(migrated.seriesReviews) ? migrated.seriesReviews : [];
            }
            if (version < 4) {
                migrated.syncMeta = {
                    accountName: migrated.syncMeta?.accountName || 'นักอ่าน KToon',
                    accountHandle: migrated.syncMeta?.accountHandle || '@reader_th',
                    deviceName: migrated.syncMeta?.deviceName || 'มือถือเครื่องนี้ (Chrome)',
                    autoSync: migrated.syncMeta?.autoSync !== false,
                    lastSyncedAt: migrated.syncMeta?.lastSyncedAt || null,
                    status: 'synced',
                    lastNotice: `อัปเกรดโครงสร้างข้อมูลสู่เวอร์ชัน ${SCHEMA_VERSION} สำเร็จ`
                };
            }
            return migrated;
        }

        function applyCustomCanvasSeriesFromData(customList) {
            if (!Array.isArray(customList) || !customList.length) return;
            const existingMap = new Map(seriesList.map((s, idx) => [s.id, idx]));
            customList.forEach(item => {
                if (!item || !item.id || !item.title) return;
                const sanitized = {
                    ...item,
                    episodes: Array.isArray(item.episodes) ? item.episodes.map(ep => ({
                        ...ep,
                        status: ep.status || 'published',
                        lines: Array.isArray(ep.lines) && ep.lines.length ? [...ep.lines] : ['เนื้อหาตอน'],
                        panels: Array.isArray(ep.panels) ? [...ep.panels] : []
                    })) : []
                };
                if (existingMap.has(item.id)) {
                    seriesList[existingMap.get(item.id)] = sanitized;
                } else {
                    seriesList.unshift(sanitized);
                }
            });
        }

        function loadState() {
            try {
                const rawStr = safeStorageRead(STORAGE_KEY) || safeStorageRead('KTOON_WEBTOON_REPLICA_V2');
                if (!rawStr) return;
                const parsed = JSON.parse(rawStr);
                const migrated = migrateSavedData(parsed);

                applyCustomCanvasSeriesFromData(migrated.customCanvasSeries);

                state = {
                    ...state,
                    ...migrated,
                    coins: Number.isFinite(Number(migrated.coins)) ? Number(migrated.coins) : state.coins,
                    dailyPasses: Number.isFinite(Number(migrated.dailyPasses)) ? Number(migrated.dailyPasses) : state.dailyPasses,
                    streakDays: Number.isFinite(Number(migrated.streakDays)) ? Number(migrated.streakDays) : state.streakDays,
                    readerSettings: {
                        ...state.readerSettings,
                        ...(migrated.readerSettings || {}),
                        autoScrollSpeed: 0
                    },
                    syncMeta: {
                        accountName: 'นักอ่าน KToon',
                        accountHandle: '@reader_th',
                        deviceName: 'มือถือเครื่องนี้ (Chrome)',
                        autoSync: true,
                        lastSyncedAt: null,
                        status: 'synced',
                        lastNotice: null,
                        ...(migrated.syncMeta || {})
                    }
                };
            } catch (err) {
                console.warn('Unable to load saved KToon state:', err);
                if (state.syncMeta) state.syncMeta.status = 'error';
            }
        }

        function saveState(syncToCloudMirror = true) {
            try {
                const envelope = {
                    schemaVersion: SCHEMA_VERSION,
                    savedAt: new Date().toISOString(),
                    data: buildSerializableReaderPayload()
                };
                const serialized = JSON.stringify(envelope);
                const res = safeStorageWrite(STORAGE_KEY, serialized);
                if (!res.ok && !window.__quotaWarned) {
                    window.__quotaWarned = true;
                    showToast('พื้นที่เก็บข้อมูลในเครื่องเต็ม ข้อมูลล่าสุดอาจไม่ถูกบันทึก ลองสำรองข้อมูลเป็นไฟล์และลบรูปเก่า');
                    setTimeout(() => { window.__quotaWarned = false; }, 15000);
                }

                if (syncToCloudMirror && state.syncMeta?.autoSync !== false) {
                    const ts = getNowThaiTimestamp();
                    envelope.data.syncMeta.lastSyncedAt = ts;
                    envelope.data.syncMeta.status = res.ok ? 'synced' : 'error';
                    state.syncMeta.lastSyncedAt = ts;
                    state.syncMeta.status = res.ok ? 'synced' : 'error';
                    safeStorageWrite(STORAGE_KEY, JSON.stringify(envelope));
                    safeStorageWrite(CLOUD_MIRROR_KEY, JSON.stringify(envelope));
                }
            } catch (err) {
                console.warn('Unable to save KToon state:', err);
                if (state.syncMeta) state.syncMeta.status = 'error';
            }
        }

        function formatCountdown(totalSecs) {
            const secs = Math.max(0, Number(totalSecs) || 0);
            const h = String(Math.floor(secs / 3600)).padStart(2, '0');
            const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
            const s = String(secs % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function voteCreatorPoll(feedId, optionId) {
            const feed = state.creatorFeeds.find(f => f.id === feedId);
            if (!feed) return;
            if (feed.votedOptionId === optionId) return;
            if (feed.votedOptionId) {
                const prev = feed.pollOptions.find(o => o.id === feed.votedOptionId);
                if (prev && prev.votes > 0) prev.votes -= 1;
            }
            const next = feed.pollOptions.find(o => o.id === optionId);
            if (next) {
                next.votes += 1;
                feed.votedOptionId = optionId;
                showToast('ส่งผลโหวตเรียบร้อยแล้ว!');
                renderApp();
            }
        }

        function handleEpisodeTap(seriesId, epId) {
            const s = seriesList.find(x => x.id === seriesId);
            if (!s) return;
            if (s.rating === '18+' && !state.showAdult && !isOwnSeries(s)) { openAdultGateModal(seriesId); return; }
            const visibleEps = getPublishedEpisodes(s);
            const ep = visibleEps.find(e => e.id === epId) || (s.episodes || []).find(e => e.id === epId) || visibleEps[0] || s.episodes[0];
            if (!ep) {
                showToast('ยังไม่มีตอนที่เปิดให้อ่านในเรื่องนี้');
                return;
            }
            const key = `${s.id}_${ep.id}`;
            const cost = Number(ep.cost || 0);
            const unlocked = cost === 0 || state.unlockedKeys.includes(key);
            if (unlocked) {
                openReader(s.id, ep.id);
                return;
            }
            if ((state.dailyPasses || 0) > 0) {
                state.dailyPasses -= 1;
                state.unlockedKeys.push(key);
                recordCoinTx('spend', 0, `ใช้ 1 ตั๋วอ่านฟรีปลดล็อก ${s.title} ตอนที่ ${ep.id}`);
                saveState();
                showToast(`ใช้ 1 ตั๋วอ่านฟรีปลดล็อกตอนที่ ${ep.id} แล้ว!`);
                openReader(s.id, ep.id);
                return;
            }
            if (state.coins >= cost) {
                state.coins -= cost;
                bumpStat(s.id, 'unlockCoins', cost);
                state.unlockedKeys.push(key);
                recordCoinTx('spend', -cost, `ปลดล็อก ${s.title} ตอนที่ ${ep.id}`);
                saveState();
                showToast(`ปลดล็อกตอนที่ ${ep.id} ใช้ ${cost} เหรียญ (คงเหลือ ${state.coins} เหรียญ)`);
                openReader(s.id, ep.id);
            } else {
                showToast(`เหรียญไม่พอ (ต้องใช้ ${cost} เหรียญ)`);
                openCoinWalletModal('wallet');
            }

                            <button onclick="toggleSubscribe('${s.id}', true)" class="px-3.5 py-1.5 rounded-full text-xs font-extrabold ${isSub ? 'bg-black/55 text-wt-green border border-wt-green/50' : 'bg-wt-green text-[#121212]'}">

        // --- 12. VERTICAL WEBTOON READER OVERLAY (SUPPORTS BOTH TEXT LINES & VERTICAL IMAGE PANELS) ---
        function applyReaderVisualFilters() {
            const eyeEl = document.getElementById('eye-care-tint');
            const dimEl = document.getElementById('brightness-dimmer');
            if (eyeEl) {
                if (state.readerSettings.eyeCare) eyeEl.classList.remove('hidden');
                else eyeEl.classList.add('hidden');
            }
            if (dimEl) {
                const dimOpacity = Math.max(0, (100 - state.readerSettings.brightness) / 100 * 0.75);
                dimEl.style.opacity = dimOpacity.toFixed(2);
            }
        }

        function stopAutoScroll() {
            if (autoScrollRaf) {
                cancelAnimationFrame(autoScrollRaf);
                autoScrollRaf = null;
            }
        }

        function startAutoScrollLoop() {
            stopAutoScroll();
            const overlay = document.getElementById('reader-overlay');
            if (!overlay || overlay.classList.contains('hidden') || !state.readerSettings.autoScrollSpeed) return;

            function step() {
                if (!state.readerSettings.autoScrollSpeed || overlay.classList.contains('hidden')) {
                    stopAutoScroll();
                    return;
                }
                overlay.scrollTop += state.readerSettings.autoScrollSpeed * 1.1;
                if (overlay.scrollTop + overlay.clientHeight >= overlay.scrollHeight - 2) {
                    state.readerSettings.autoScrollSpeed = 0;
                    stopAutoScroll();
                    if (activeReaderContext) {
                        openReader(activeReaderContext.seriesId, activeReaderContext.epId, 100, true);
                    }
                    return;
                }
                autoScrollRaf = requestAnimationFrame(step);
            }
            autoScrollRaf = requestAnimationFrame(step);
        }

        function handleReaderScroll() {
            const overlay = document.getElementById('reader-overlay');
            if (!overlay || !activeReaderContext || overlay.classList.contains('hidden')) return;
            const maxScroll = Math.max(1, overlay.scrollHeight - overlay.clientHeight);
            const pct = Math.min(100, Math.max(1, Math.round((overlay.scrollTop / maxScroll) * 100)));
            const key = `${activeReaderContext.seriesId}_${activeReaderContext.epId}`;
            state.episodeProgress[key] = pct;

            const bar = document.getElementById('reader-progress-bar');
            const pctBadge = document.getElementById('reader-progress-pct');
            if (bar) bar.style.width = `${pct}%`;
            if (pctBadge) pctBadge.textContent = `${pct}%`;

            clearTimeout(window._saveProgressTimer);
            window._saveProgressTimer = setTimeout(() => saveState(), 300);
        }

        function buildReaderPanelsHtml(s, ep, rs) {

            const lines = Array.isArray(ep.lines) && ep.lines.length ? ep.lines : ['กำลังอัปเดตเนื้อหาตอน...'];

        function openReader(seriesId, epId, resumePercent = null, preserveScroll = false) {
            const s = seriesList.find(x => x.id === seriesId);

            const epIndex = epPool.findIndex(e => e.id === epId);
            const ep = epPool[epIndex] || epPool[0];
            if (!ep) return;
            const prevEp = epIndex > 0 ? epPool[epIndex - 1] : null;
            const nextEp = epIndex < epPool.length - 1 ? epPool[epIndex + 1] : null;

            const overlay = document.getElementById('reader-overlay');
            const prevScrollTop = preserveScroll ? overlay.scrollTop : 0;

            const isNewView = !preserveScroll && (overlay.classList.contains('hidden') || !activeReaderContext || activeReaderContext.epId !== ep.id || activeReaderContext.seriesId !== s.id);
            if (isNewView) bumpStat(s.id, 'views', 1, ep.id);
            activeReaderContext = { seriesId: s.id, epId: ep.id };
            const key = `${s.id}_${ep.id}`;
            if (!state.readKeys.includes(key)) state.readKeys.push(key);
            const savedPct = resumePercent !== null ? resumePercent : (state.episodeProgress[key] || 0);
            if (!state.episodeProgress[key]) state.episodeProgress[key] = Math.max(5, savedPct);

            state.recentHistory = state.recentHistory.filter(r => r.seriesId !== s.id);
            state.recentHistory.unshift({ seriesId: s.id, epId: ep.id, epLabel: `Ep.${ep.id} ${ep.title}`, timeLabel: 'อ่านล่าสุดวันนี้' });
            evaluateBadges();
            saveState();

            const isLiked = state.likedKeys.includes(key);
            const rawComments = state.comments.filter(c => c.seriesId === s.id && c.epId === ep.id && !c.hidden && !(state.blockedUsers || []).includes(c.user));
            const epComments = [...rawComments].sort((a, b) => state.commentSort === 'top' ? (b.likes || 0) - (a.likes || 0) : b.id - a.id);
            const epPoll = getOrCreateEpisodePoll(s, ep);

            stopAutoScroll();
            state.readerSettings.autoScrollSpeed = 0;

        function toggleCreatorFeedLike(feedId) {
            const feed = state.creatorFeeds.find(f => f.id === feedId);

            feed.liked = !feed.liked;
            feed.likes += feed.liked ? 1 : -1;
            saveState();
            renderApp();
        }

        function toggleSubscribe(seriesId, refreshDetail = false) {
            const idx = state.subscribedIds.indexOf(seriesId);
            if (idx > -1) {
                state.subscribedIds.splice(idx, 1);
                showToast('ยกเลิกติดตามแล้ว');

                state.subscribedIds.push(seriesId);
                showToast('เพิ่มในรายการที่ติดตามแล้ว!');

            evaluateBadges();
            saveState();

            else renderApp();

                state.savedIds.splice(idx, 1);
                showToast('นำออกจากรายการที่บันทึกแล้ว');
            } else {
                state.savedIds.push(seriesId);
                showToast('บันทึกเรื่องนี้ไว้แล้ว!');
            }
            saveState();
            openSeriesDetail(seriesId);
        }

        function toggleEpisodeLike(key, seriesId, epId) {
            const idx = state.likedKeys.indexOf(key);
            if (idx > -1) state.likedKeys.splice(idx, 1);
            else state.likedKeys.push(key);
            saveState();
            openReader(seriesId, epId);
        }

        function submitReaderComment(e, seriesId, epId) {
            e.preventDefault();
            const input = document.getElementById('reader-comment-input');
            const text = input.value.trim();
            if (!text) return;
            state.comments.unshift({ id: Date.now(), seriesId, epId, user: 'คุณ (KToon)', text, time: 'เมื่อสักครู่', likes: 1, replies: [] });
            evaluateBadges();
            saveState();
            openReader(seriesId, epId, null, true);
        }

        function toggleCommentLike(commentId, seriesId, epId) {
            const c = state.comments.find(x => x.id === commentId);
            if (!c) return;
            if (!state.likedCommentIds) state.likedCommentIds = [];
            const idx = state.likedCommentIds.indexOf(commentId);
            if (idx > -1) {
                state.likedCommentIds.splice(idx, 1);
                c.likes = Math.max(0, (c.likes || 1) - 1);
            } else {
                state.likedCommentIds.push(commentId);
                c.likes = (c.likes || 0) + 1;
            }
            saveState();
            openReader(seriesId, epId, null, true);
        }

        function toggleReplyInput(commentId, seriesId, epId) {
            state.replyingCommentId = state.replyingCommentId === commentId ? null : commentId;
            openReader(seriesId, epId, null, true);
        }

        function submitCommentReply(e, commentId, seriesId, epId) {
            e.preventDefault();
            const inp = document.getElementById(`reply-input-${commentId}`);
            if (!inp) return;
            const text = inp.value.trim();
            if (!text) return;
            const c = state.comments.find(x => x.id === commentId);
            if (!c) return;
            if (!c.replies) c.replies = [];
            c.replies.push({ user: 'คุณ (KToon)', text, time: 'เมื่อสักครู่' });
            state.replyingCommentId = null;
            saveState();
            openReader(seriesId, epId, null, true);
            showToast('ส่งข้อความตอบกลับแล้ว!');
        }

        function getOrCreateEpisodePoll(s, ep) {
            const key = `${s.id}_${ep.id}`;
            if (!state.episodePolls) state.episodePolls = {};
            if (!state.episodePolls[key]) {
                state.episodePolls[key] = {
                    question: `คุณรู้สึกอย่างไรกับ "${ep.title}" ในตอนนี้?`,
                    options: [
                        { id: 'p1', label: '🔥 สนุกมาก ลุ้นตอนต่อไปไม่ไหวแล้ว!', votes: 128 },
                        { id: 'p2', label: '💖 ฟินจิกหมอน เคมีพระนางดีสุดๆ', votes: 94 },
                        { id: 'p3', label: '😲 หักมุมเกินคาด ต้องอ่านซ้ำอีกรอบ', votes: 61 }
                    ],
                    votedOptionId: null
                };
            }
            return state.episodePolls[key];
        }

        function voteEpisodePoll(key, optionId, seriesId, epId) {
            const poll = state.episodePolls[key];
            if (!poll) return;
            if (poll.votedOptionId) {
                const prev = poll.options.find(o => o.id === poll.votedOptionId);
                if (prev) prev.votes = Math.max(0, prev.votes - 1);
            }
            const next = poll.options.find(o => o.id === optionId);
            if (next) next.votes += 1;
            poll.votedOptionId = optionId;
            saveState();
            openReader(seriesId, epId, null, true);
            showToast('บันทึกผลโหวตท้ายตอนแล้ว!');
        }

        function getSeriesRatingStats(seriesId) {
            const list = (state.seriesReviews || []).filter(r => r.seriesId === seriesId);
            if (!list.length) return { avg: '9.85', count: 0 };
            const sum = list.reduce((acc, r) => acc + Number(r.stars || 5), 0);
            const avg = ((sum / list.length) * 2).toFixed(2);
            return { avg, count: list.length };
        }

        function submitCheerCoins(seriesId, epId) {
            const s = seriesList.find(x => x.id === seriesId);
            const amt = state.cheerAmount || 15;
            if (state.coins < amt) {
                showToast('เหรียญไม่พอ! เช็กอินรายวันเพื่อรับเหรียญเพิ่ม');
                openCoinWalletModal('wallet');
                return;
            }
            const msg = (document.getElementById('cheer-message-input')?.value || '').trim();
            state.coins -= amt;
            bumpStat(seriesId, 'cheerCoins', amt);
            recordCoinTx('spend', -amt, `ส่งกำลังใจให้ ${s.author} (${s.title})${msg ? `: "${msg}"` : ''}`);
            evaluateBadges();
            saveState();
            closeUtilityModal();
            renderApp();
            showToast(`ส่ง ${amt} เหรียญให้กำลังใจ ${s.author} แล้ว!`);
        }

        function recordCoinTx(type, amount, title) {
            if (!state.coinTransactions) state.coinTransactions = [];
            state.coinTransactions.unshift({
                id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                type,
                amount,
                title,
                time: 'วันนี้'
            });
        }

        function evaluateBadges() {

        function compressImageFileToDataUrl(file, maxWidth = 640, quality = 0.72) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round(img.width * scale));
                            canvas.height = Math.max(1, Math.round(img.height * scale));
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        } catch (err) {
                            reject(err);
                        }
                    };
                    img.onerror = reject;
                    img.src = String(reader.result || '');
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function handleC2PanelUpload(event) {

            const hub = getCreatorHubState();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const compressedUrl = await compressImageFileToDataUrl(file, 640, 0.72);
                    const nextNum = hub.draftEpPanels.length + 1;
                    hub.draftEpPanels.push({
                        id: 'pnl_' + Date.now() + '_' + i,
                        title: `ช่องที่ ${nextNum}`,
                        caption: file.name.replace(/\.[^.]+$/, ''),
                        imageUrl: compressedUrl,

                    showToast(`ข้ามไฟล์ ${file.name} ที่อ่านไม่ได้`);
                }

            showToast(`เพิ่มช่องภาพแนวตั้ง ${files.length} ช่องเรียบร้อย!`);

        function publishEpisodeFromBuilderC2(e, seriesId) {
            e.preventDefault();
            const hub = getCreatorHubState();
            const s = seriesList.find(x => x.id === seriesId);
            if (!s) return;

            const title = (document.getElementById('c2-ep-title')?.value || '').trim();
            const epStatus = document.getElementById('c2-ep-status')?.value || 'published';
            const cost = Math.max(0, Number(document.getElementById('c2-ep-cost')?.value || 0));
            const scheduleRaw = document.getElementById('c2-ep-schedule')?.value || '';
            const lines = (document.getElementById('c2-ep-lines')?.value || '')
                .split('\n')
                .map(l => l.trim())
                .filter(Boolean);

            if (!title) {
                showToast('กรุณากรอกชื่อตอนก่อนครับ');
                return;
            }
            if (epStatus === 'scheduled') {
                const t = new Date(scheduleRaw).getTime();
                if (!scheduleRaw || !Number.isFinite(t)) {
                    showToast('กรุณาเลือกวันและเวลาที่จะเผยแพร่');
                    return;
                }
                if (t <= Date.now()) {
                    showToast('เวลาที่ตั้งต้องเป็นเวลาในอนาคต');
                    return;
                }
            }

            if (!Array.isArray(s.episodes)) s.episodes = [];
            const panelsCopy = Array.isArray(hub.draftEpPanels) ? hub.draftEpPanels.map(p => ({ ...p })) : [];
            const finalLines = lines.length ? lines : (panelsCopy.length ? panelsCopy.map(p => p.caption || p.title) : ['เนื้อหาตอนใหม่']);
            const scheduledAt = epStatus === 'scheduled' ? scheduleRaw : null;

            let epObj = null;
            const isEditing = hub.editingEpisodeId !== null && hub.editingEpisodeId !== undefined;
            if (isEditing) epObj = s.episodes.find(x => x.id === hub.editingEpisodeId) || null;
            const wasLive = epObj ? isEpisodeLive(epObj) : false;

            if (epObj) {
                Object.assign(epObj, { title, cost, status: epStatus, lines: finalLines, panels: panelsCopy, scheduledAt, thumb: hub.draftEpThumb || '' });
                if (epStatus === 'published' && !wasLive) epObj.date = 'วันนี้';
            } else {
                const nextId = s.episodes.reduce((maxId, item) => Math.max(maxId, Number(item.id || 0)), 0) + 1;
                epObj = { id: nextId, title, date: epStatus === 'published' ? 'วันนี้' : 'ยังไม่เผยแพร่', cost, likes: 1, status: epStatus, lines: finalLines, panels: panelsCopy, scheduledAt, thumb: hub.draftEpThumb || '' };
                s.episodes.push(epObj);
            }

            if (epStatus === 'published') {
                s.isDraftSeries = false;
                s.badge = s.isCanvas ? 'CANVAS' : 'ตอนใหม่';
                s.promoText = 'อัปเดตตอนใหม่แล้ว!';
                if (!wasLive) notifyNewEpisode(s, epObj);
            }

            hub.draftEpTitle = '';
            hub.draftEpCost = 0;
            hub.draftEpStatus = 'published';
            hub.draftEpSchedule = '';
            hub.draftEpLines = ['ฉากเปิดตอนที่ชวนติดตาม...'];
            hub.draftEpPanels = [];
            hub.editingEpisodeId = null;
            hub.draftEpThumb = '';

            saveState(true);
            renderCreatorStudioModalContent();
            renderApp();
            const label = isEditing ? 'บันทึกการแก้ไข' : (epStatus === 'published' ? 'เผยแพร่' : epStatus === 'scheduled' ? 'ตั้งเวลาเผยแพร่' : 'บันทึกฉบับร่าง');
            showToast(`${label}ตอนที่ ${epObj.id} \"${title}\" เรียบร้อย`);
        }

        function moveEpisodeC2(seriesId, idx, delta) {
            const s = seriesList.find(x => x.id === seriesId);
            if (!s || !Array.isArray(s.episodes)) return;
            const targetIdx = idx + delta;
            if (targetIdx < 0 || targetIdx >= s.episodes.length) return;
            const temp = s.episodes[idx];
            s.episodes[idx] = s.episodes[targetIdx];
            s.episodes[targetIdx] = temp;
            saveState(true);
            renderCreatorStudioModalContent();
            showToast('สลับลำดับตอนเรียบร้อยแล้ว');
        }

        function toggleEpisodeStatusC2(seriesId, epId) {
            const s = seriesList.find(x => x.id === seriesId);
            if (!s || !Array.isArray(s.episodes)) return;
            const ep = s.episodes.find(e => e.id === epId);
            if (!ep) return;
            if ((ep.status || 'published') === 'published') {
                ep.status = 'draft';
            } else {
                ep.status = 'published';
                ep.scheduledAt = null;
                ep.date = 'วันนี้';
                s.isDraftSeries = false;
                notifyNewEpisode(s, ep);
            }
            saveState(true);
            renderCreatorStudioModalContent();
            renderApp();
            showToast(ep.status === 'published' ? `เผยแพร่ตอนที่ ${ep.id} แล้ว` : `เปลี่ยนตอนที่ ${ep.id} เป็นฉบับร่างแล้ว`);
        }

        function deleteEpisodeC2(seriesId, epId) {
            const s = seriesList.find(x => x.id === seriesId);
            if (!s || !Array.isArray(s.episodes)) return;
            s.episodes = s.episodes.filter(e => e.id !== epId);
            saveState(true);
            renderCreatorStudioModalContent();
            renderApp();
            showToast('ลบตอนออกจากซีรีส์แล้ว');
        }

        function exportJsonBackup() {
            try {
                const backupPackage = {
                    app: 'KToon',
                    schemaVersion: SCHEMA_VERSION,
                    exportedAt: new Date().toISOString(),
                    data: buildSerializableReaderPayload()
                };
                const jsonText = JSON.stringify(backupPackage, null, 2);
                const blob = new Blob([jsonText], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const dateStamp = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `ktoon-reader-backup-${dateStamp}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                if (state.syncMeta) {
                    state.syncMeta.lastNotice = `ส่งออกไฟล์สำรอง JSON (ktoon-reader-backup-${dateStamp}.json) เรียบร้อยแล้ว`;
                }
                saveState(false);
                showToast('ส่งออกไฟล์สำรอง JSON เรียบร้อยแล้ว!');
            } catch (_) {
                showToast('ไม่สามารถส่งออกไฟล์สำรองได้ในเบราว์เซอร์นี้');
            }
        }

        function validateAndRestoreBackupText(rawText) {
            let parsed;
            try {
                parsed = JSON.parse(rawText);
            } catch (_) {
                return { ok: false, error: 'ไฟล์ไม่ใช่รูปแบบ JSON ที่ถูกต้อง' };
            }
            const sourceData = parsed && parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed;
            if (!sourceData || typeof sourceData !== 'object') {
                return { ok: false, error: 'ไม่พบโครงสร้างข้อมูลนักอ่านในไฟล์สำรอง' };
            }
            const hasValidShape =
                Number.isFinite(Number(sourceData.coins)) ||
                Array.isArray(sourceData.subscribedIds) ||
                Array.isArray(sourceData.recentHistory) ||
                (sourceData.episodeProgress && typeof sourceData.episodeProgress === 'object');
            if (!hasValidShape) {
                return { ok: false, error: 'ไฟล์สำรองขาดข้อมูลสำคัญของบัญชีนักอ่าน' };
            }

            const migrated = migrateSavedData(parsed);
            applyCustomCanvasSeriesFromData(migrated.customCanvasSeries);

            state = {
                ...state,
                ...migrated,
                coins: Number.isFinite(Number(migrated.coins)) ? Number(migrated.coins) : 50,
                dailyPasses: Number.isFinite(Number(migrated.dailyPasses)) ? Number(migrated.dailyPasses) : 2,
                streakDays: Number.isFinite(Number(migrated.streakDays)) ? Number(migrated.streakDays) : 1,
                readerSettings: {
                    ...state.readerSettings,
                    ...(migrated.readerSettings || {}),
                    autoScrollSpeed: 0
                },
                syncMeta: {
                    accountName: migrated.syncMeta?.accountName || state.syncMeta?.accountName || 'นักอ่าน KToon',
                    accountHandle: migrated.syncMeta?.accountHandle || state.syncMeta?.accountHandle || '@reader_th',
                    deviceName: migrated.syncMeta?.deviceName || 'มือถือเครื่องนี้ (Chrome)',
                    autoSync: migrated.syncMeta?.autoSync !== false,
                    lastSyncedAt: getNowThaiTimestamp(),
                    status: 'synced',
                    lastNotice: 'กู้คืนข้อมูลจากไฟล์สำรอง JSON สำเร็จครบถ้วน!'
                }
            };
            saveState(true);
            return { ok: true };
        }

        function handleBackupFileUpload(event) {
            const file = event.target?.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const res = validateAndRestoreBackupText(String(reader.result || ''));
                if (!res.ok) {
                    showToast(`กู้คืนไม่สำเร็จ: ${res.error}`);
                    return;
                }
                openAccountSyncModal('backup');
                renderApp();
                showToast('กู้คืนข้อมูลจากไฟล์ JSON เรียบร้อยแล้ว!');
            };
            reader.onerror = () => showToast('เกิดข้อผิดพลาดในการอ่านไฟล์สำรอง');
            reader.readAsText(file, 'utf-8');
        }

        function restoreBackupFromTextArea() {
            const ta = document.getElementById('backup-json-textarea');
            if (!ta) return;
            const text = ta.value.trim();
            if (!text) {
                showToast('กรุณาวางโค้ด JSON สำรองหรือเลือกไฟล์ก่อนครับ');
                return;
            }
            const res = validateAndRestoreBackupText(text);
            if (!res.ok) {
                showToast(`กู้คืนไม่สำเร็จ: ${res.error}`);
                return;
            }
            openAccountSyncModal('backup');
            renderApp();
            showToast('กู้คืนข้อมูลจาก JSON สำเร็จแล้ว!');
        }

        function saveAccountProfileSettings() {
            const nameVal = (document.getElementById('sync-account-name')?.value || '').trim() || 'นักอ่าน KToon';

            state.syncMeta.accountName = nameVal;
            state.syncMeta.accountHandle = handleVal.startsWith('@') ? handleVal : `@${handleVal}`;
            state.syncMeta.lastNotice = `อัปเดตโปรไฟล์เป็น ${state.syncMeta.accountName} (${state.syncMeta.accountHandle}) แล้ว`;
            saveState(true);
            openAccountSyncModal('account');
            renderApp();

        let reportDraft = null;

        function ensureStateExtras() {
            if (!Array.isArray(state.followedAuthors)) state.followedAuthors = [];
            if (!Array.isArray(state.blockedUsers)) state.blockedUsers = [];
            if (state.mySubTab === 'creator') state.mySubTab = 'recent';
            if (!Array.isArray(state.reports)) state.reports = [];
            if (!Array.isArray(state.notifications)) state.notifications = [];
            if (!state.seriesStats || typeof state.seriesStats !== 'object') state.seriesStats = {};
        }

        function getNowLabel() {
            try {
                return new Date().toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            } catch (_) {
                return 'เมื่อสักครู่';
            }
        }

        function bumpStat(seriesId, field, amount = 1, epId = null) {
            ensureStateExtras();
            const st = state.seriesStats[seriesId] || (state.seriesStats[seriesId] = { views: 0, epViews: {}, cheerCoins: 0, unlockCoins: 0 });
            if (!st.epViews) st.epViews = {};
            if (field === 'views') {
                st.views = (st.views || 0) + amount;
                if (epId !== null) st.epViews[epId] = (st.epViews[epId] || 0) + amount;
            } else {
                st[field] = (st[field] || 0) + amount;
            }
        }

        // ---------- Notifications ----------
        function pushNotification(n) {
            ensureStateExtras();
            state.notifications.unshift({ id: 'n_' + Date.now() + '_' + Math.floor(Math.random() * 1000), read: false, time: getNowLabel(), ...n });
            state.notifications = state.notifications.slice(0, 60);
        }

        function notifyNewEpisode(s, ep) {
            ensureStateExtras();
            const watching = state.subscribedIds.includes(s.id) || state.followedAuthors.includes(s.author);
            if (!watching) return;
            pushNotification({ type: 'episode', seriesId: s.id, epId: ep.id, title: `ตอนใหม่: ${s.title}`, body: `ตอนที่ ${ep.id} ${ep.title}` });
        }

        function getUnreadNotifCount() {
            return (state.notifications || []).filter(n => !n.read).length;
        }

        function renderBellButton() {
            const n = getUnreadNotifCount();
            return `
                <button onclick="openNotificationsModal()" class="relative p-1 text-white hover:text-wt-green" title="การแจ้งเตือน">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 0 0 4 0" stroke-linecap="round" stroke-linejoin="round"/></svg>

                </div>

            showUtilityModal();

        function openNotification(id) {
            const n = (state.notifications || []).find(x => x.id === id);

                openNotificationsModal();

        function markAllNotificationsRead() {
            (state.notifications || []).forEach(n => { n.read = true; });

            renderApp();

        function clearNotifications() {
            state.notifications = [];

        // ---------- Scheduled episodes ----------
        function processScheduledEpisodes() {
            let changed = false;
            seriesList.forEach(s => (s.episodes || []).forEach(ep => {
                if (ep.status === 'scheduled' && ep.scheduledAt && new Date(ep.scheduledAt).getTime() <= Date.now()) {
                    ep.status = 'published';
                    ep.date = 'วันนี้';
                    s.isDraftSeries = false;
                    s.badge = s.isCanvas ? 'CANVAS' : 'ตอนใหม่';
                    s.promoText = 'อัปเดตตอนใหม่แล้ว!';
                    notifyNewEpisode(s, ep);
                    changed = true;
                }
            }));
            if (changed) {
                saveState(true);
                renderApp();
            }
            return changed;

        // ---------- Share ----------
        async function shareSeries(seriesId) {
            const s = seriesList.find(x => x.id === seriesId);
            if (!s) return;
            const url = location.href.split('#')[0] + '#series=' + encodeURIComponent(s.id);
            const text = `${s.title} — ${s.synopsis}`;
            try {
                if (navigator.share) {
                    await navigator.share({ title: s.title, text, url });
                    return;
                }
            } catch (err) {
                if (err && err.name === 'AbortError') return;
            }
            try {
                await navigator.clipboard.writeText(`${s.title}\n${url}`);
                showToast('คัดลอกลิงก์แล้ว');
            } catch (_) {
                showToast('เบราว์เซอร์นี้ไม่รองรับการแชร์');
            }
        }

        // ===== SAMPLE ART GENERATOR (วาดภาพตัวอย่างเป็น SVG ไม่ต้องใช้รูปภายนอก) =====
        const __artCache = {};

        function artHash(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function artRng(seed) {
            let a = seed >>> 0;
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function artHexToHsl(hex) {
            const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
            if (!m) return [215, 70, 60];
            const n = parseInt(m[1], 16);
            const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
            const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
            let h = 0, s = 0;
            const l = (mx + mn) / 2;
            if (mx !== mn) {
                const d = mx - mn;
                s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
                h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
                h *= 60;
            }
            return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
        }

        function artEsc(t) {
            return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function artIsMark(ch) {
            return /[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(ch);
        }

        function artTextW(t, fs) {
            let n = 0;
            for (const ch of t) if (!artIsMark(ch)) n++;
            return n * fs * 0.54;
        }

        function artWrapRaw(text, maxW, fs) {
            let segs;
            try {
                segs = [...new Intl.Segmenter('th', { granularity: 'word' }).segment(text)].map(x => x.segment);
            } catch (_) {
                segs = text.split(/(\s+)/);
            }
            const lines = [];
            let cur = '';
            for (const sg of segs) {
                if (!cur || artTextW(cur + sg, fs) <= maxW) {
                    cur += sg;
                } else {
                    lines.push(cur.trim());
                    cur = sg.replace(/^\s+/, '');
                }
                while (artTextW(cur, fs) > maxW) {
                    let acc = '';
                    for (const ch of cur) {
                        if (acc && artTextW(acc + ch, fs) > maxW && !artIsMark(ch)) break;
                        acc += ch;
                    }
                    if (!acc || acc.length >= cur.length) break;
                    lines.push(acc);
                    cur = cur.slice(acc.length);
                }
            }
            if (cur.trim()) lines.push(cur.trim());
            return lines.slice(0, 7);
        }

        function artWrap(text, maxW, fs) {
            let w = maxW;
            let lines = artWrapRaw(text, w, fs);
            for (let a = 0; a < 4 && lines.length > 1; a++) {
                if (artTextW(lines[lines.length - 1], fs) >= w * 0.35) break;
                w *= 0.86;
                lines = artWrapRaw(text, w, fs);
            }
            if (lines.length > 1 && artTextW(lines[lines.length - 1], fs) < fs * 1.2) {
                const l = lines.pop();
                lines[lines.length - 1] += l;
            }
            return lines.slice(0, 7);
        }

        function artMotif(s) {
            const t = `${s.genre || ''} ${s.tags || ''} ${s.title || ''}`;
            if (/สมุทร|ทะเล/.test(t)) return 'sea';
            if (/สยองขวัญ/.test(t)) return 'horror';
            if (/ทิปตูน|ฮีลใจ|สัตว์เลี้ยง/.test(t)) return 'cute';
            if (/กำลังภายใน|ยุทธ/.test(t)) return 'mountain';
            if (/แฟนตาซี|ย้อนยุค|ผจญภัย/.test(t)) return 'castle';
            if (/แอ็กชัน|ลึกลับ|ไอดอล|ดราม่า|ที่ทำงาน/.test(t)) return 'city';
            return ['city', 'room', 'sky'][artHash(String(s.id)) % 3];
        }

        function artScene(motif, P, rnd, W, H) {
            let o = `<defs>
                <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.top}"/><stop offset=".55" stop-color="${P.mid}"/><stop offset="1" stop-color="${P.bot}"/></linearGradient>
                <radialGradient id="gl" cx="50%" cy="28%" r="65%"><stop offset="0" stop-color="${P.glow}" stop-opacity=".5"/><stop offset="1" stop-color="${P.glow}" stop-opacity="0"/></radialGradient>
                <radialGradient id="vg" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
                <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
            </defs>
            <rect width="${W}" height="${H}" fill="url(#bg)"/><rect width="${W}" height="${H}" fill="url(#gl)"/>`;
            const stars = (n, maxY) => {
                let s = '';
                for (let i = 0; i < n; i++) s += `<circle cx="${Math.round(rnd() * W)}" cy="${Math.round(rnd() * maxY)}" r="${(0.8 + rnd() * 2.2).toFixed(1)}" fill="#fff" opacity="${(0.35 + rnd() * 0.6).toFixed(2)}"/>`;
                return s;
            };
            const moon = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r * 1.9}" fill="${P.soft}" opacity=".13"/><circle cx="${cx}" cy="${cy}" r="${r * 1.4}" fill="${P.soft}" opacity=".18"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#FFF8E1"/><circle cx="${cx - r * 0.3}" cy="${cy - r * 0.2}" r="${r * 0.22}" fill="#F0E6C8" opacity=".7"/><circle cx="${cx + r * 0.35}" cy="${cy + r * 0.3}" r="${r * 0.15}" fill="#F0E6C8" opacity=".6"/>`;
            const hills = (c1, c2) => `<path d="M0 ${H - 230} Q 160 ${H - 300} 330 ${H - 240} T ${W} ${H - 250} L ${W} ${H} L 0 ${H} Z" fill="${c1}"/><path d="M0 ${H - 140} Q 200 ${H - 200} 400 ${H - 150} T ${W} ${H - 160} L ${W} ${H} L 0 ${H} Z" fill="${c2}"/>`;

            if (motif === 'cute') {
                o = o.replace(/<rect width="\d+" height="\d+" fill="url\(#gl\)"\/>/, '');
                for (let i = 0; i < 5; i++) {
                    const cx = 60 + rnd() * (W - 120), cy = 80 + rnd() * 320, k = 0.7 + rnd() * 0.8;
                    o += `<g opacity=".9" transform="translate(${cx} ${cy}) scale(${k})"><ellipse cx="0" cy="0" rx="70" ry="28" fill="#fff"/><ellipse cx="-34" cy="-14" rx="34" ry="26" fill="#fff"/><ellipse cx="22" cy="-22" rx="40" ry="30" fill="#fff"/></g>`;
                }
                for (let i = 0; i < 14; i++) {
                    const x = rnd() * W, y = 60 + rnd() * (H - 300), r = 6 + rnd() * 10;
                    o += `<path d="M${x} ${y - r} L${x + r * 0.28} ${y - r * 0.28} L${x + r} ${y} L${x + r * 0.28} ${y + r * 0.28} L${x} ${y + r} L${x - r * 0.28} ${y + r * 0.28} L${x - r} ${y} L${x - r * 0.28} ${y - r * 0.28} Z" fill="#fff" opacity=".85"/>`;
                }
                o += `<path d="M0 ${H - 120} Q 160 ${H - 190} 330 ${H - 130} T ${W} ${H - 140} L ${W} ${H} L 0 ${H} Z" fill="hsl(${P.h},60%,78%)"/>`;
            } else if (motif === 'city') {
                o += stars(25, 260) + moon(Math.round(120 + rnd() * 400), 130, 46);
                let x = -20;
                while (x < W) {
                    const w = 46 + rnd() * 60, h = 150 + rnd() * 300;
                    o += `<rect x="${x}" y="${H - h}" width="${w}" height="${h}" fill="hsl(${P.h},40%,${9 + Math.round(rnd() * 6)}%)"/>`;
                    for (let wy = H - h + 14; wy < H - 20; wy += 24) for (let wx = x + 8; wx < x + w - 10; wx += 16) if (rnd() > 0.55) o += `<rect x="${wx}" y="${wy}" width="8" height="12" fill="#FFE9A8" opacity="${(0.4 + rnd() * 0.5).toFixed(2)}"/>`;
                    x += w + 4;
                }
            } else if (motif === 'room') {
                o += `<rect x="70" y="90" width="250" height="330" rx="6" fill="hsl(${P.h},60%,78%)" opacity=".9"/><rect x="70" y="90" width="250" height="330" rx="6" fill="none" stroke="#2a2030" stroke-width="12"/><line x1="195" y1="90" x2="195" y2="420" stroke="#2a2030" stroke-width="8"/><line x1="70" y1="255" x2="320" y2="255" stroke="#2a2030" stroke-width="8"/><polygon points="70,420 320,420 520,${H} 40,${H}" fill="url(#ray)"/>`;
                let bx = 380;
                for (let r = 0; r < 3; r++) {
                    o += `<rect x="360" y="${130 + r * 110}" width="250" height="8" fill="#1a1218"/>`;
                    bx = 366;
                    while (bx < 600) { const bw = 10 + rnd() * 14, bh = 50 + rnd() * 40; o += `<rect x="${bx}" y="${130 + r * 110 - bh}" width="${bw}" height="${bh}" fill="hsl(${Math.round(rnd() * 360)},45%,${30 + Math.round(rnd() * 20)}%)"/>`; bx += bw + 2; }
                }
                o += `<rect x="0" y="${H - 170}" width="${W}" height="170" fill="hsl(${P.h},35%,8%)" opacity=".85"/>`;
            } else if (motif === 'castle') {
                o += stars(45, 330) + moon(Math.round(130 + rnd() * 380), 150, 56);
                const cx = 200 + rnd() * 240;
                const tw = (x, w, h, roof) => `<rect x="${x}" y="${H - h}" width="${w}" height="${h}" fill="hsl(${P.h},35%,8%)"/><polygon points="${x - 8},${H - h} ${x + w + 8},${H - h} ${x + w / 2},${H - h - roof}" fill="hsl(${P.h},40%,6%)"/>`;
                o += hills(`hsl(${P.h},38%,11%)`, `hsl(${P.h},40%,7%)`) + tw(cx - 110, 60, 260, 70) + tw(cx - 40, 80, 330, 90) + tw(cx + 50, 60, 240, 64) + `<rect x="${cx - 110}" y="${H - 160}" width="220" height="160" fill="hsl(${P.h},35%,8%)"/>`;
                for (let i = 0; i < 6; i++) o += `<rect x="${cx - 90 + i * 34}" y="${H - 120 + (i % 2) * 24}" width="9" height="15" fill="#FFE9A8" opacity=".85"/>`;
            } else if (motif === 'sea') {
                o += stars(30, 220) + moon(Math.round(160 + rnd() * 320), 140, 50);
                for (let i = 0; i < 4; i++) {
                    const y = 360 + i * 95, a = 18 + i * 6;
                    o += `<path d="M0 ${y} Q 80 ${y - a} 160 ${y} T 320 ${y} T 480 ${y} T 640 ${y} L 640 ${H} L 0 ${H} Z" fill="hsl(${P.h},${50 + i * 5}%,${22 - i * 4}%)" opacity=".92"/>`;
                }
                for (let i = 0; i < 16; i++) o += `<circle cx="${Math.round(rnd() * W)}" cy="${Math.round(430 + rnd() * (H - 440))}" r="${(3 + rnd() * 9).toFixed(1)}" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>`;
            } else if (motif === 'mountain') {
                o += `<circle cx="${Math.round(160 + rnd() * 320)}" cy="260" r="90" fill="#FF8A4C" opacity=".55"/><circle cx="${Math.round(160 + rnd() * 320)}" cy="260" r="62" fill="#FFB27A" opacity=".5"/>`;
                const mt = (base, amp, c) => { let d = `M0 ${H}`; let x = 0; d += ` L0 ${base}`; while (x < W) { x += 70 + rnd() * 70; d += ` L${Math.min(x, W)} ${base - rnd() * amp}`; x += 40 + rnd() * 50; d += ` L${Math.min(x, W)} ${base + 30 + rnd() * 30}`; } d += ` L${W} ${H} Z`; return `<path d="${d}" fill="${c}"/>`; };
                o += mt(430, 230, `hsl(${P.h},35%,18%)`) + `<rect y="440" width="${W}" height="120" fill="#fff" opacity=".07"/>` + mt(520, 170, `hsl(${P.h},38%,11%)`) + `<rect y="560" width="${W}" height="110" fill="#fff" opacity=".08"/>` + mt(640, 120, `hsl(${P.h},40%,6%)`);
            } else if (motif === 'horror') {
                o += moon(Math.round(440 + rnd() * 100), 130, 54) + `<ellipse cx="420" cy="140" rx="150" ry="26" fill="${P.mid}" opacity=".85"/><ellipse cx="360" cy="152" rx="110" ry="20" fill="${P.top}" opacity=".9"/>`;
                for (let i = 0; i < 4; i++) {
                    const x = 50 + i * 190 + rnd() * 50;
                    o += `<path d="M${x} ${H} L${x + 6} ${H - 380} M${x + 5} ${H - 250} L${x - 70} ${H - 330} M${x + 5} ${H - 300} L${x + 80} ${H - 390} M${x + 6} ${H - 380} L${x - 30} ${H - 450}" stroke="#05050a" stroke-width="12" stroke-linecap="round" fill="none"/>`;
                }
                const ex = 90 + rnd() * 440;
                o += `<ellipse cx="${ex}" cy="${H - 300}" rx="9" ry="6" fill="#ff3b3b"/><ellipse cx="${ex + 30}" cy="${H - 300}" rx="9" ry="6" fill="#ff3b3b"/><rect y="${H - 200}" width="${W}" height="200" fill="#fff" opacity=".05"/>`;
            } else {
                o += stars(60, 400) + moon(Math.round(120 + rnd() * 400), 140, 52) + hills(`hsl(${P.h},38%,12%)`, `hsl(${P.h},40%,8%)`);
            }
            return o;
        }

        function artChar(x, y, k, c) {
            const dx = (c.look || 0) * 9;
            const sk = c.skin, shade = 'rgba(0,0,0,.14)';
            let eyes = '', mouth = '', brows = '';
            const ey = 8;
            const eye = (ex) => `<ellipse cx="${ex}" cy="${ey}" rx="10" ry="${c.expr === 'surprise' ? 15 : 12.5}" fill="#1B1B2B"/><ellipse cx="${ex}" cy="${ey + 2}" rx="6" ry="${c.expr === 'surprise' ? 9 : 7.5}" fill="${c.eye}"/><circle cx="${ex - 3}" cy="${ey - 4}" r="3.6" fill="#fff"/><circle cx="${ex + 3}" cy="${ey + 5}" r="1.8" fill="#fff" opacity=".8"/>`;
            if (c.expr === 'happy') {
                eyes = [-24, 24].map(ex => `<path d="M${ex - 10 + dx} ${ey + 3} Q ${ex + dx} ${ey - 12} ${ex + 10 + dx} ${ey + 3}" stroke="#1B1B2B" stroke-width="5" fill="none" stroke-linecap="round"/>`).join('');
            } else {
                eyes = eye(-24 + dx) + eye(24 + dx);
            }
            const by = c.expr === 'surprise' ? -26 : -18;
            brows = c.expr === 'sad'
                ? `<path d="M${-38 + dx} ${by + 4} L${-12 + dx} ${by - 4} M${12 + dx} ${by - 4} L${38 + dx} ${by + 4}" stroke="${c.hair}" stroke-width="5" stroke-linecap="round"/>`
                : `<path d="M${-36 + dx} ${by} Q ${-24 + dx} ${by - 7} ${-10 + dx} ${by}" stroke="${c.hair}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${10 + dx} ${by} Q ${24 + dx} ${by - 7} ${36 + dx} ${by}" stroke="${c.hair}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
            if (c.expr === 'surprise') mouth = `<ellipse cx="${dx}" cy="46" rx="8" ry="11" fill="#7A2E3A"/><ellipse cx="${dx}" cy="50" rx="5" ry="5" fill="#E86B7A"/>`;
            else if (c.expr === 'sad') mouth = `<path d="M${-12 + dx} 50 Q ${dx} 40 ${12 + dx} 50" stroke="#7A3B3B" stroke-width="4" fill="none" stroke-linecap="round"/>`;
            else if (c.expr === 'neutral') mouth = `<path d="M${-9 + dx} 44 L${9 + dx} 44" stroke="#7A3B3B" stroke-width="4" stroke-linecap="round"/>`;
            else mouth = `<path d="M${-15 + dx} 40 Q ${dx} 58 ${15 + dx} 40 Z" fill="#8A2F3C" stroke="#7A3B3B" stroke-width="3" stroke-linejoin="round"/><path d="M${-9 + dx} 44 Q ${dx} 50 ${9 + dx} 44" stroke="#fff" stroke-width="3" fill="none" opacity=".8"/>`;
            const backHair = c.long ? `<path d="M-70 -6 C-92 80 -84 160 -54 200 L54 200 C84 160 92 80 70 -6 Z" fill="${c.hair}"/>` : '';
            const bangs = c.long
                ? `<path d="M-60 -2 C-66 -78 -30 -98 6 -98 C52 -98 70 -60 60 -2 C48 -34 28 -50 4 -48 C-22 -46 -44 -32 -60 -2 Z" fill="${c.hair}"/><path d="M-60 -2 C-72 30 -70 70 -62 96 C-56 60 -52 30 -46 10 Z" fill="${c.hair}"/><path d="M60 -2 C72 30 70 70 62 96 C56 60 52 30 46 10 Z" fill="${c.hair}"/>`
                : `<path d="M-62 4 C-72 -74 -34 -104 8 -102 C56 -100 76 -62 62 4 C54 -20 38 -40 14 -44 C-6 -30 -34 -26 -62 4 Z" fill="${c.hair}"/><path d="M-20 -84 C-10 -98 22 -100 40 -84" stroke="#fff" stroke-opacity=".22" stroke-width="7" fill="none" stroke-linecap="round"/>`;
            return `<g transform="translate(${x} ${y}) scale(${k})" stroke="rgba(0,0,0,.18)" stroke-width="2" stroke-linejoin="round">
                ${backHair}
                <path d="M-112 240 C-110 124 -62 94 -24 88 L24 88 C62 94 110 124 112 240 Z" fill="${c.cloth}"/>
                <path d="M-24 88 L0 128 L24 88 Z" fill="${sk}"/>
                <rect x="-17" y="46" width="34" height="48" rx="12" fill="${sk}"/><rect x="-17" y="46" width="34" height="18" fill="${shade}" stroke="none"/>
                <ellipse cx="-56" cy="10" rx="9" ry="14" fill="${sk}"/><ellipse cx="56" cy="10" rx="9" ry="14" fill="${sk}"/>
                <ellipse cx="0" cy="0" rx="57" ry="65" fill="${sk}"/>
                <g stroke="none">
                    <ellipse cx="${-36 + dx}" cy="30" rx="12" ry="7" fill="#FF8FA3" opacity=".38"/><ellipse cx="${36 + dx}" cy="30" rx="12" ry="7" fill="#FF8FA3" opacity=".38"/>
                    ${eyes}${brows}
                    <path d="M${dx + 1} 22 q 5 7 0 9" stroke="rgba(120,60,40,.55)" stroke-width="3" fill="none" stroke-linecap="round"/>
                    ${mouth}
                </g>
                ${bangs}
            </g>`;
        }

        function artBubble(W, lines, fs, tailX, style, label) {
            const lh = Math.round(fs * 1.42);
            const maxLen = Math.max(...lines.map(l => artTextW(l, fs)));
            const bw = Math.min(W - 40, Math.max(200, maxLen + 70));
            const bh = lines.length * lh + 40;
            const bx = (W - bw) / 2, by = 34;
            const isBubble = style === 'bubble';
            let out = '';
            if (isBubble) {
                const tx = Math.max(bx + 40, Math.min(bx + bw - 40, tailX));
                out += `<path d="M${tx - 20} ${by + bh - 4} L${tx + 6} ${by + bh + 42} L${tx + 22} ${by + bh - 4} Z" fill="#fff" stroke="#14141c" stroke-width="4" stroke-linejoin="round"/>`;
            }
            out += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="${isBubble ? 34 : 10}" fill="${isBubble ? '#fff' : '#FFF4CC'}" stroke="#14141c" stroke-width="4"/>`;
            if (isBubble) {
                const tx = Math.max(bx + 40, Math.min(bx + bw - 40, tailX));
                out += `<rect x="${tx - 16}" y="${by + bh - 7}" width="34" height="8" fill="#fff"/>`;
            }
            lines.forEach((ln, i) => {
                out += `<text x="${W / 2}" y="${by + 22 + fs * 0.95 + i * lh}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#14141c" font-family="'Noto Sans Thai','Sarabun','Prompt','Tahoma',sans-serif">${artEsc(ln)}</text>`;
            });
            if (label) out += `<rect x="${bx}" y="${by - 20}" width="${artTextW(label, 20) + 30}" height="30" rx="6" fill="#14141c"/><text x="${bx + 15}" y="${by + 1}" font-size="19" font-weight="800" fill="#FFD84D" font-family="'Noto Sans Thai','Sarabun','Prompt','Tahoma',sans-serif">${artEsc(label)}</text>`;
            return { svg: out, bottom: by + bh };
        }

        function getSampleArt(s, ep, idx, total, text, opts = {}) {
            const key = `${s.id}|${ep.id}|${idx}|${opts.thumb ? 't' : 'p'}|${artHash(String(text || ''))}`;
            if (__artCache[key]) return __artCache[key];
            const W = 640, H = opts.thumb ? 560 : 780;
            const rnd = artRng(artHash(key));
            const [h] = artHexToHsl(s.accent);
            const motif = artMotif(s);
            const cute = motif === 'cute';
            const P = cute
                ? { h, top: `hsl(${h},75%,86%)`, mid: `hsl(${(h + 20) % 360},70%,82%)`, bot: `hsl(${(h + 40) % 360},65%,76%)`, glow: '#fff', soft: '#fff' }
                : { h, top: `hsl(${h},52%,26%)`, mid: `hsl(${(h + 18) % 360},55%,16%)`, bot: `hsl(${(h + 40) % 360},60%,7%)`, glow: s.accent || '#60A5FA', soft: `hsl(${h},75%,80%)` };
            const sid = String(s.id);
            const skins = ['#FFE3CC', '#F8D0AE', '#EDB98A', '#D9A06F'];
            const hairs = ['#2B1B17', '#4A2C2A', '#1F2A44', '#6B3E26', '#C48B3A', '#7A3E5D', '#2E4A3F', '#B8B8C8'];
            const eyesC = ['#3B2A22', '#2D4B7A', '#5B3A8C', '#2F6B4F', '#8A4B2A'];
            const hA = artHash(sid + 'a'), hB = artHash(sid + 'b');
            const A = { skin: skins[hA % 4], hair: hairs[(hA >> 3) % 8], eye: eyesC[(hA >> 6) % 5], cloth: `hsl(${(h + 150) % 360},42%,${cute ? 58 : 40}%)`, long: (hA >> 9) % 2 === 0 };
            const B = { skin: skins[hB % 4], hair: hairs[(hB >> 3) % 8], eye: eyesC[(hB >> 6) % 5], cloth: `hsl(${(h + 30) % 360},45%,${cute ? 66 : 52}%)`, long: (hB >> 9) % 2 === 1 };
            const t = String(text || '');
            const exprFor = () => /!/.test(t) ? (rnd() > 0.4 ? 'surprise' : 'happy') : /\?/.test(t) ? 'neutral' : /\.\.\./.test(t) ? 'sad' : (rnd() > 0.5 ? 'smile' : 'neutral');
            const shot = opts.thumb ? 1 : idx % 4;
            let svg = artScene(motif, P, rnd, W, H);
            let tailX = W / 2;
            if (shot === 0) {
                svg += artChar(W * 0.5, H - 170, 0.62, { ...A, look: 0, expr: 'smile' });
            } else if (shot === 1) {
                const cx = W * (0.42 + rnd() * 0.16);
                svg += artChar(cx, H - 215, opts.thumb ? 1.35 : 1.5, { ...A, look: rnd() > 0.5 ? 1 : -1, expr: exprFor() });
                tailX = cx;
            } else if (shot === 2) {
                svg += artChar(W * 0.27, H - 200, 1.12, { ...A, look: 1, expr: exprFor() });
                svg += artChar(W * 0.74, H - 190, 1.18, { ...B, look: -1, expr: exprFor() });
                tailX = rnd() > 0.5 ? W * 0.27 : W * 0.74;
            } else {
                let lines = '';
                for (let i = 0; i < 34; i++) {
                    const a = (i / 34) * Math.PI * 2 + rnd() * 0.1, r1 = 150 + rnd() * 60, r2 = 700;
                    lines += `<line x1="${W / 2 + Math.cos(a) * r1}" y1="${H * 0.62 + Math.sin(a) * r1}" x2="${W / 2 + Math.cos(a) * r2}" y2="${H * 0.62 + Math.sin(a) * r2}" stroke="#fff" stroke-opacity="${(0.06 + rnd() * 0.12).toFixed(2)}" stroke-width="${(2 + rnd() * 5).toFixed(1)}"/>`;
                }
                svg += lines;
                const cx = W * (0.38 + rnd() * 0.24);
                svg += artChar(cx, H - 190, 1.7, { ...B, look: rnd() > 0.5 ? 1 : -1, expr: rnd() > 0.5 ? 'surprise' : 'happy' });
                tailX = cx;
            }
            svg += `<rect width="${W}" height="${H}" fill="url(#vg)"/>`;
            if (!opts.thumb && t) {
                const fs = t.length > 150 ? 23 : t.length > 90 ? 26 : 30;
                const lines = artWrap(t, W - 120, fs);
                const b = artBubble(W, lines, fs, tailX, shot === 0 ? 'caption' : 'bubble', idx === 0 ? `ตอนที่ ${ep.id}` : '');
                svg += b.svg;
            }
            if (!opts.thumb) svg += `<text x="${W - 14}" y="${H - 12}" text-anchor="end" font-size="15" font-weight="700" fill="#fff" opacity=".35" font-family="sans-serif">${idx + 1}/${total}</text>`;
            const out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${svg}</svg>`;
            const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(out);
            __artCache[key] = url;
            return url;
        }

        function blockCommentUser(commentId, seriesId, epId) {
            const c = state.comments.find(x => x.id === commentId);
            if (!c || c.user === MY_COMMENT_USER) return;
            ensureStateExtras();
            if (!state.blockedUsers.includes(c.user)) state.blockedUsers.push(c.user);
            saveState();
            openReader(seriesId, epId, null, true);
            showToast(`บล็อก ${c.user} แล้ว เลิกบล็อกได้ที่เมนูบัญชี`);
        }

        function unblockUserAt(i) {
            ensureStateExtras();
            state.blockedUsers.splice(i, 1);
            saveState();
            openAccountSyncModal('account');
        }

        function unfollowAuthorAt(i) {
            ensureStateExtras();
            state.followedAuthors.splice(i, 1);
            saveState();
            openAccountSyncModal('account');
        }

        function postAnnouncement(seriesId) {
            const s = seriesList.find(x => x.id === seriesId);
            const input = document.getElementById('c3-announce-text');
            const text = (input?.value || '').trim();
            if (!s || !text) {
                showToast('กรุณาพิมพ์ข้อความประกาศก่อนครับ');
                return;
            }
            if (!Array.isArray(s.announcements)) s.announcements = [];
            s.announcements.unshift({ text: text.slice(0, 200), time: getNowLabel() });
            s.announcements = s.announcements.slice(0, 5);
            ensureStateExtras();
            if (state.subscribedIds.includes(s.id) || state.followedAuthors.includes(s.author)) {
                pushNotification({ type: 'announce', seriesId: s.id, title: `ประกาศจาก ${s.title}`, body: text.slice(0, 80) });
            }
            saveState(true);
            renderCreatorStudioModalContent();
            renderApp();
            showToast('โพสต์ประกาศแล้ว');
        }

        function deleteAnnouncement(seriesId, i) {
            const s = seriesList.find(x => x.id === seriesId);
            if (!s || !Array.isArray(s.announcements)) return;
            s.announcements.splice(i, 1);
            saveState(true);
            renderCreatorStudioModalContent();
            renderApp();
        }

        // =====================================================================
        // AUTH & WRITER MODE (ล็อกอิน/สมัครสมาชิก + โหมดนักเขียนอยู่ที่หน้า CANVAS)
        // ใช้ Supabase Auth ผ่าน REST ตั้งค่าเซิร์ฟเวอร์ได้ที่เมนูบัญชี > ตั้งค่าเซิร์ฟเวอร์
        // =====================================================================
        const AUTH_KEY = 'KTOON_AUTH_V1';
        const BACKEND_KEY = 'KTOON_BACKEND_V1';
        const KTOON_BACKEND_DEFAULT = { url: '', anonKey: '' };
        let authState = { session: null, user: null };
        let authUiMode = 'login';
        let __afterAuth = null;

        function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
        function lsDel(k) { try { localStorage.removeItem(k); } catch (_) {} }

        function getBackend() {
            try {
                const o = JSON.parse(lsGet(BACKEND_KEY) || 'null');
                if (o && o.url && o.anonKey) return { url: String(o.url).trim().replace(/\/+$/, ''), anonKey: String(o.anonKey).trim() };
            } catch (_) {}
            return { url: (KTOON_BACKEND_DEFAULT.url || '').replace(/\/+$/, ''), anonKey: KTOON_BACKEND_DEFAULT.anonKey || '' };
        }

        function backendReady() {
            const b = getBackend();
            return /^https:\/\/[^\s]+$/.test(b.url) && b.anonKey.length > 20;
        }

        function authPersist() {
            if (authState.session) lsSet(AUTH_KEY, JSON.stringify(authState));
            else lsDel(AUTH_KEY);
        }

        function authErrText(d, status) {
            const m = String((d && (d.msg || d.error_description || d.message || d.error)) || '').toLowerCase();
            if (m.includes('invalid login')) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
            if (m.includes('already registered') || m.includes('already been registered')) return 'อีเมลนี้สมัครสมาชิกไว้แล้ว ลองเข้าสู่ระบบแทน';
            if (m.includes('at least') && m.includes('character')) return 'รหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัวอักษร)';
            if (m.includes('not confirmed')) return 'กรุณากดยืนยันอีเมลก่อนเข้าสู่ระบบ';
            if (m.includes('rate limit') || status === 429) return 'ลองบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่';
            if (m.includes('valid email') || m.includes('invalid email') || m.includes('unable to validate email')) return 'รูปแบบอีเมลไม่ถูกต้อง';
            if (m.includes('signups not allowed') || m.includes('signup is disabled')) return 'ขณะนี้ปิดรับสมัครสมาชิก';
            if (status === 401 || status === 403) return 'ไม่มีสิทธิ์ใช้งาน กรุณาเข้าสู่ระบบใหม่';
            return `เกิดข้อผิดพลาด (${status}) กรุณาลองใหม่อีกครั้ง`;
        }

        async function authRequest(path, opts = {}) {
            const b = getBackend();
            const { method = 'GET', body = null, token = null } = opts;
            let res;
            try {
                res = await fetch(b.url + path, {
                    method,
                    headers: { 'apikey': b.anonKey, 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || b.anonKey) },
                    body: body ? JSON.stringify(body) : undefined
                });
            } catch (_) {
                throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
            }
            let data = null;
            try { data = await res.json(); } catch (_) {}
            if (!res.ok) throw new Error(authErrText(data, res.status));
            return data || {};
        }

        function authSetSession(d) {
            const exp = d.expires_at || (Math.floor(Date.now() / 1000) + (d.expires_in || 3600));
            authState.session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: exp };
            if (d.user) authState.user = d.user;
            authPersist();
        }

        async function authEnsureFresh() {
            const s = authState.session;
            if (!s) return;
            if (s.expires_at - 60 > Date.now() / 1000) return;
            try {
                const d = await authRequest('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: s.refresh_token } });
                authSetSession(d);
            } catch (_) {
                authState = { session: null, user: null };
                authPersist();
            }
        }

        async function authInit() {
            try {
                const saved = JSON.parse(lsGet(AUTH_KEY) || 'null');
                if (saved && saved.session) authState = saved;
            } catch (_) {}
            if (!backendReady()) return;
            try {
                const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
                if (h.get('error_description')) {
                    showToast('เข้าสู่ระบบไม่สำเร็จ: ' + h.get('error_description'));
                    history.replaceState(null, '', location.pathname + location.search);
                } else if (h.get('access_token')) {
                    authSetSession({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: Number(h.get('expires_in') || 3600) });
                    history.replaceState(null, '', location.pathname + location.search);
                    authState.user = await authRequest('/auth/v1/user', { token: authState.session.access_token });
                    authPersist();
                    showToast('เข้าสู่ระบบด้วย Google สำเร็จ');
                }
                await authEnsureFresh();
                if (authState.session && !authState.user) {
                    authState.user = await authRequest('/auth/v1/user', { token: authState.session.access_token });
                    authPersist();
                }
            } catch (_) {
                authState = { session: null, user: null };
                authPersist();
            }
            renderApp();
        }

        function isLoggedIn() { return !!(authState.session && authState.user); }

        function getWriterProfile() {
            if (backendReady()) {
                const m = (authState.user && authState.user.user_metadata) || {};
                return m.is_writer ? { penName: m.pen_name || m.display_name || 'นักเขียน' } : null;
            }
            return state.writerProfile || null;
        }
        function isWriter() { return !!getWriterProfile(); }
        function getWriterPenName() { const p = getWriterProfile(); return p ? p.penName : ''; }
        function currentOwnerId() { return backendReady() ? (authState.user ? authState.user.id : '') : 'local'; }
        function isOwnSeries(s) {
            if (!s) return false;
            if (s.ownerId && s.ownerId !== 'local') return s.ownerId === currentOwnerId();
            return typeof s.id === 'string' && s.id.startsWith('c_');
        }
        function canUseStudio() { return backendReady() ? (isLoggedIn() && isWriter()) : isWriter(); }

        async function submitAuthForm(e) {
            e.preventDefault();
            if (!backendReady()) return;
            const email = (document.getElementById('auth-email')?.value || '').trim();
            const pass = document.getElementById('auth-pass')?.value || '';
            const btn = document.getElementById('auth-submit');
            if (btn) { btn.disabled = true; btn.textContent = 'กำลังดำเนินการ...'; }
            try {
                if (authUiMode === 'signup') {
                    const name = (document.getElementById('auth-name')?.value || '').trim();
                    if (pass !== document.getElementById('auth-pass2')?.value) throw new Error('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
                    const d = await authRequest('/auth/v1/signup', { method: 'POST', body: { email, password: pass, data: { display_name: name, agreed_terms_at: new Date().toISOString() } } });
                    if (d.access_token) {
                        authSetSession(d);
                        if (!authState.user) authState.user = await authRequest('/auth/v1/user', { token: authState.session.access_token });
                        authPersist();
                        finishAuthSuccess('สมัครสมาชิกสำเร็จ ยินดีต้อนรับ!');
                    } else {
                        authUiMode = 'login';
                        renderAuthModal('', 'ส่งอีเมลยืนยันให้แล้ว กรุณากดลิงก์ในอีเมล จากนั้นกลับมาเข้าสู่ระบบ');
                    }
                } else if (authUiMode === 'forgot') {
                    await authRequest('/auth/v1/recover', { method: 'POST', body: { email } });
                    authUiMode = 'login';
                    renderAuthModal('', 'ส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลแล้ว (ถ้าอีเมลนี้มีบัญชีอยู่)');
                } else {
                    const d = await authRequest('/auth/v1/token?grant_type=password', { method: 'POST', body: { email, password: pass } });
                    authSetSession(d);
                    if (!authState.user) authState.user = await authRequest('/auth/v1/user', { token: authState.session.access_token });
                    authPersist();
                    finishAuthSuccess('เข้าสู่ระบบสำเร็จ');
                }
            } catch (err) {
                renderAuthModal(err.message || 'เกิดข้อผิดพลาด', '');

                    const u = await authRequest('/auth/v1/user', { method: 'PUT', token: authState.session.access_token, body: { data: { pen_name: pen, is_writer: true, writer_since: new Date().toISOString() } } });

            __afterAuth = null;

        async function testBackendSettings() {
            const url = (document.getElementById('be-url')?.value || '').trim().replace(/\/+$/, '');
            const key = (document.getElementById('be-key')?.value || '').trim();
            const out = document.getElementById('be-result');
            if (!/^https:\/\//.test(url) || key.length < 20) { out.innerHTML = '<span class="text-rose-300">กรอก URL (ขึ้นต้นด้วย https://) และ key ให้ครบก่อน</span>'; return; }
            out.innerHTML = '<span class="text-wt-muted">กำลังทดสอบ...</span>';
            try {
                const res = await fetch(url + '/auth/v1/settings', { headers: { apikey: key } });
                if (!res.ok) throw new Error('status ' + res.status);
                const d = await res.json();
                const google = d && d.external && d.external.google;
                const auto = d && d.mailer_autoconfirm;
                out.innerHTML = `<span class="text-wt-green font-bold">✓ เชื่อมต่อสำเร็จ</span><br><span class="text-wt-muted">Google: ${google ? 'เปิดอยู่' : 'ยังไม่เปิด'} • ยืนยันอีเมล: ${auto ? 'ไม่ต้องยืนยัน' : 'ต้องกดลิงก์ในอีเมล'}</span>`;
            } catch (_) {
                out.innerHTML = '<span class="text-rose-300">เชื่อมต่อไม่สำเร็จ ตรวจสอบ URL และ key อีกครั้ง</span>';
            }
        }

        function saveBackendSettings() {
            const url = (document.getElementById('be-url')?.value || '').trim().replace(/\/+$/, '');
            const key = (document.getElementById('be-key')?.value || '').trim();
            if (!/^https:\/\//.test(url) || key.length < 20) { showToast('กรอก URL และ key ให้ถูกต้องก่อน'); return; }
            if (key.split('.').length === 3) {
                try {
                    const payload = JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                    if (payload.role === 'service_role') { showToast('นี่คือ service_role key ห้ามใช้ในแอป กรุณาใช้ anon public key'); return; }
                } catch (_) {}
            }
            lsSet(BACKEND_KEY, JSON.stringify({ url, anonKey: key }));
            authState = { session: null, user: null };
            authPersist();
            showToast('บันทึกแล้ว กำลังรีโหลด...');
            setTimeout(() => location.reload(), 600);
        }

        function clearBackendSettings() {
            lsDel(BACKEND_KEY);
            authState = { session: null, user: null };
            authPersist();
            showToast('ล้างแล้ว กำลังรีโหลด...');
            setTimeout(() => location.reload(), 600);
        }
